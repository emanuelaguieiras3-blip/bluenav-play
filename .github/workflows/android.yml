name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # o SDK do Android já vem instalado na máquina do GitHub; só aceita as licenças
      - name: Licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gerar projeto Android (Capacitor)
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          node patch-android.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../BlueNav-Play.apk

      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BlueNav Play — APK ${{ github.run_number }}
          files: BlueNav-Play.apk
          body: |
            Baixe o **BlueNav-Play.apk** abaixo e abra no celular Android.
            Se o Android avisar, permita "instalar apps desconhecidos" para o navegador/arquivos.
            O app abre https://bluenav-play.vercel.app (precisa de internet) e pede permissão de câmera.
